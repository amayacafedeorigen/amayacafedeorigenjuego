@keyframes tkin{from{transform:translateY(45cqw) rotate(9deg)}}

.tr{flex:1;padding:2.4cqw;text-align:center}.tt{font-size:2.2cqw;line-height:1.5;color:#7a1d12}.ts{font-size:3.2cqw;margin:1cqw 0}
.cd{display:flex;gap:1cqw;align-items:center;justify-content:center;background:#fff7e0;border:.3cqw dashed #7a1d12;padding:1.1cqw;margin:1.2cqw 0 1.6cqw}
.cd span{font-size:2.2cqw;color:#3b1f0a;user-select:all;-webkit-user-select:all}

</style>

<body>
<div id="frame">
  <canvas id="cv" width="960" height="540"></canvas>

  <div id="intro" class="ov">
    <div><span class="tag P">🇨🇴 MARQUETALIA · CALDAS</span>
      <h1 class="P">AMAYA<br>CAFÉ DE ORIGEN</h1>
      <div class="sub">Del cafetal y el Willys hasta tu taza</div></div>
    <div><button id="go" class="btn">▶ INICIAR</button>
      <div class="ctls"><div class="cg"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> o <span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span><b>MOVER</b></div><div class="cg"><span class="key">ESPACIO</span> o clic<b>ACTUAR</b></div><div class="cg">📱 Joystick<b>MOVER</b> Botón A<b>ACTUAR</b></div></div></div>
  </div>

  <div id="hud" class="hid"><div><b class="P">MISIÓN <span id="qn">1</span>/<span id="qm">11</span></b><div id="qt">…</div><div id="bar"><i></i></div></div><button id="mute" title="Sonido">🔊</button></div>
  <div id="dlg" class="hid"><div id="sp" class="P">Amaya</div><div id="tx"></div><div id="nx" class="P">▶</div></div>
  <div id="hint" class="hid"></div>
  <div id="toast" class="P"></div>

  <div id="load" class="ov hid"><h2 class="P">CARGANDO…</h2><p>Amaya viaja en su moto hacia el pueblo</p></div>
  <div id="skip" class="ov hid"><h2 class="P">UN TIEMPO DESPUÉS…</h2></div>

  <div id="ph" class="ov hid"><div class="phone"><div class="ph-h">📱 <span id="pht">Cliente</span></div><div class="ph-b" id="phb"></div></div><div class="web" id="web"></div></div>
  <div id="mod" class="ov hid"></div>
  <div id="fade"></div>
</div>

<div id="ctl">
  <div class="cw"><div id="joy"><div id="kn"></div></div><div class="cl">MOVER</div></div>
  <div class="cw"><button id="ba">A</button><div class="cl">ACTUAR</div></div>
</div>

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.scale(3,3);
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const hash=(a,b)=>{let h=Math.sin(a*127.1+b*311.7)*43758.5;return h-Math.floor(h)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- audio ---------- */
const A={c:null,mute:false,
 init(){if(!this.c){const C=window.AudioContext||window.webkitAudioContext;if(C)this.c=new C()}if(this.c&&this.c.state==='suspended')this.c.resume()},
 t(f,ty='square',d=.1,v=.08,at=0){if(this.mute)return;this.init();if(!this.c)return;const o=this.c.createOscillator(),n=this.c.createGain(),s=this.c.currentTime+at;
  o.type=ty;o.frequency.setValueAtTime(f,s);n.gain.setValueAtTime(v,s);n.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(n);n.connect(this.c.destination);o.start(s);o.stop(s+d)},
 click(){this.t(620,'square',.07,.1)},step(){this.t(120+Math.random()*30,'triangle',.04,.04)},
 ok(){[523,659,784,1046].forEach((f,i)=>this.t(f,'triangle',.22,.12,i*.1))},
 hit(k){({water:()=>{this.t(340,'sine',.12,.1);this.t(490,'sine',.12,.1,.07)},smoke:()=>this.t(150+Math.random()*60,'sawtooth',.18,.06),spark:()=>this.t(700+Math.random()*300,'square',.07,.08),gold:()=>{this.t(880,'triangle',.1,.1);this.t(1320,'triangle',.14,.1,.06)}})[k||'spark']()},
 moto(){for(let i=0;i<8;i++)this.t(90+i*25,'sawtooth',.09,.08,i*.07)},
 start(){if(this.on)return;this.on=1;const m=[392,440,523,440,392,330,392,0,330,392,440,392,330,294,330,0];let i=0;
  setInterval(()=>{const f=m[i++%m.length];if(f)this.t(f,'triangle',.28,.035);if(i%4==1)this.t(98,'sine',.4,.05)},300)}
};

/* ---------- sprites ---------- */
const tree=(x,y)=>{R(x-11,y+1,22,4,'#0003');R(x-2,y-6,4,8,'#5a3a1a');R(x-9,y-22,18,10,'#1f6b32');R(x-7,y-28,14,8,'#2e8b43');R(x-4,y-18,3,3,'#4cc060')};
const bush=(x,y,s)=>{R(x-7,y+1,14,3,'#0003');R(x-1,y-3,2,5,'#4a3319');R(x-6,y-10,12,8,s?'#2e8b43':'#256f38');R(x-4,y-13,8,4,'#3da04f');
  if(s!=2){R(x-5,y-8,2,2,'#e33');R(x+2,y-9,2,2,'#e33');R(x-1,y-6,2,2,'#e33')}else R(x-4,y-8,2,2,'#fff')};
const sack=(x,y)=>{R(x-6,y-9,12,11,'#b98e4c');R(x-4,y-11,8,3,'#cfa45c');R(x-4,y-5,8,2,'#c8242f')};
const house=(x,y,w,h,roof,door,label)=>{R(x-3,y+h,w+10,4,'#0003');R(x,y,w,h,'#f3e9c8');R(x,y+h-5,w,5,'#d8c89a');
  for(let i=0;i<9;i++)R(x-4+i*2,y-i*2.6+0,w+8-i*4,3,roof);R(x+4,y-10,w-8,10,roof);
  R(x+w/2-6,y+h-18,12,18,door);R(x+w/2-6,y+h-18,12,2,'#00000044');R(x+w/2-8,y+h-2,16,2,'#bdb092');R(x+w/2-7,y+h-19,1,19,'#3b1d0b');R(x+w/2+6,y+h-19,1,19,'#3b1d0b');R(x+w/2+3,y+h-9,1,1,'#fde047');R(x+6,y+8,10,9,'#8ad4f0');R(x+w-16,y+8,10,9,'#8ad4f0');R(x+6,y+12,10,1,'#fff8');R(x+w-16,y+12,10,1,'#fff8');
  if(label)txt(label,x+w/2,y-14,'#fde047')};
const txt=(s,x,y,c='#fff',sz=6)=>{sz=Math.max(sz,6.5);g.font=sz+'px "Press Start 2P",monospace';g.textAlign='center';g.lineJoin='round';g.lineWidth=2.4;g.strokeStyle='#000';g.strokeText(s,x,y);g.fillStyle=c;g.fillText(s,x,y)};
const willys=(x,y,c)=>{R(x+2,y+14,6,6,'#111');R(x+26,y+14,6,6,'#111');R(x+4,y+16,2,2,'#aaa');R(x+28,y+16,2,2,'#aaa');
  R(x,y+6,36,10,c);R(x+6,y,18,8,'#f6f1e0');R(x+8,y+2,6,5,'#8ad4f0');R(x+16,y+2,6,5,'#8ad4f0');R(x+34,y+8,3,5,'#ffe27a');R(x+5,y-4,9,4,'#b98e4c');R(x+15,y-4,8,4,'#b98e4c');R(x+10,y+9,16,2,'#0003')};
const moto=(x,y)=>{R(x+1,y+10,7,7,'#111');R(x+19,y+10,7,7,'#111');R(x+3,y+12,3,3,'#ccc');R(x+21,y+12,3,3,'#ccc');
 R(x,y+8,9,2,'#8b929a');R(x+19,y+8,8,2,'#d62438');R(x+8,y+9,11,6,'#8b929a');R(x+10,y+11,7,4,'#6b727a');R(x+2,y+13,8,2,'#b8bec6');R(x+9,y+7,3,2,'#8b929a');
 R(x+3,y+6,8,2,'#222');R(x,y+6,2,2,'#ef4444');R(x+11,y+4,8,4,'#d62438');R(x+12,y+4,5,1,'#f0606e');
 R(x+21,y+4,2,8,'#9aa1a9');R(x+18,y+3,4,1,'#222');R(x+22,y+3,4,4,'#d62438');R(x+25,y+4,2,2,'#fff3a8')};
function amaya(x,y,d,f,mv){const b=mv?Math.abs(Math.sin(f))*1.5|0:0,l=mv?(Math.sin(f)>0?1:-1):0;
  R(x-6,y-1,12,3,'#0004');R(x-3+l,y-5,3,5,'#2b3a55');R(x+l*-1,y-5,3,5,'#2b3a55');R(x-3+l,y-1,3,1,'#111');R(x-l,y-1,3,1,'#111');
  const u=y-b;R(x-4,u-12,8,8,'#7ec8f0');R(x-4,u-5,8,1,'#5aa9d8');
